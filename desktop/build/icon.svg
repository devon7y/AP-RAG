<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Source for build/icon.png (electron-builder derives .icns/.ico from the PNG).
       Regenerate with: qlmanage -t -s 1024 -o build build/icon.svg
                        mv build/icon.svg.png build/icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS-style squircle with transparent margins -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g transform="rotate(-5 512 512)">
    <!-- paper sheet with soft offset shadow -->
    <rect x="334" y="276" width="380" height="500" rx="26" fill="#000000" opacity="0.35"/>
    <rect x="322" y="262" width="380" height="500" rx="26" fill="url(#sheet)"/>

    <!-- knowledge-graph motif -->
    <g stroke="#6366f1" stroke-width="13" stroke-linecap="round">
      <line x1="512" y1="430" x2="408" y2="332"/>
      <line x1="512" y1="430" x2="618" y2="352"/>
      <line x1="512" y1="430" x2="402" y2="522"/>
      <line x1="512" y1="430" x2="612" y2="508"/>
      <line x1="408" y1="332" x2="618" y2="352" opacity="0.45"/>
    </g>
    <circle cx="408" cy="332" r="22" fill="#4f46e5"/>
    <circle cx="618" cy="352" r="24" fill="#4f46e5"/>
    <circle cx="402" cy="522" r="24" fill="#4f46e5"/>
    <circle cx="612" cy="508" r="21" fill="#4f46e5"/>
    <circle cx="512" cy="430" r="34" fill="#0ea5e9"/>

    <!-- text lines -->
    <rect x="372" y="596" width="300" height="20" rx="10" fill="#cbd5e1"/>
    <rect x="372" y="636" width="240" height="20" rx="10" fill="#cbd5e1"/>
    <rect x="372" y="676" width="270" height="20" rx="10" fill="#cbd5e1"/>
  </g>
</svg>

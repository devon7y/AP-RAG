<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Source for build/icon.png (electron-builder derives .icns/.ico from the PNG).
       Regenerate with: npx electron build/render-icon.mjs
       (NOT qlmanage — it composites onto opaque white and eats the alpha.)

       Mark: a seven-edge node star. Each spoke is two straight legs meeting at a
       lightly filleted knee; nodes and stroke weights are graded by height, so the
       star is heaviest at the crown and lightest at its feet. -->
  <defs>
    <!-- Exactly vertical: x1 == x2. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Lit from above, and the mark stays white: pure #ffffff across the top
         half, falling away only near the feet. The modelling comes from the
         shaded lower edges and the cast shadow, not from dimming the star. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="2.6" x2="0" y2="61.4">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f1f3f8"/>
      <stop offset="1" stop-color="#d0d7e2"/>
    </linearGradient>

    <filter id="shade" x="-30%" y="-30%" width="160%" height="160%"
            color-interpolation-filters="sRGB">
      <!-- Alpha nudged up, then subtracted from the shape: what is left is a
           band hugging the lower inside edge, which becomes the shading. No
           highlight rim — nothing can be brighter than the white it would sit on. -->
      <feOffset in="SourceAlpha" dy="-1" result="up"/>
      <feGaussianBlur in="up" stdDeviation="0.72" result="upBlur"/>
      <feComposite in="SourceAlpha" in2="upBlur" operator="out" result="band"/>
      <feFlood flood-color="#626e80" flood-opacity="0.92" result="tone"/>
      <feComposite in="tone" in2="band" operator="in" result="inner"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner"/>
      </feMerge>
    </filter>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.3" stdDeviation="1.2"
                    flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- macOS-style squircle with transparent margins (Apple's 824/1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- Mark at 88% of the tile. y is 25 lower than x, not a typo: the graded
       nodes make the star's real bounding box sit 2.17 field-units above the
       field's centre (top edge 0.5, bottom edge 59.17), so centring the field
       would leave the mark riding high. This centres the ink instead — measured
       at 511.5/512 on the rendered PNG. -->
  <g transform="translate(149.44,173.97) scale(11.33)">
   <g filter="url(#lift)">
    <g filter="url(#shade)">
    <g fill="none" stroke="url(#ink)" stroke-linecap="round">
      <path d="M32,32 L36.34,21.56 Q37.3,19.25 36.34,16.94 L32,6.5" stroke-width="4.4"/>
      <path d="M32,32 L42.87,28.88 Q45.27,28.19 46.48,26 L51.94,16.1" stroke-width="4.1"/>
      <path d="M32,32 L26.54,22.1 Q25.33,19.91 22.93,19.22 L12.06,16.1" stroke-width="4.1"/>
      <path d="M32,32 L41.21,38.56 Q43.25,40.01 45.71,39.59 L56.86,37.67" stroke-width="3.5"/>
      <path d="M32,32 L20.85,30.09 Q18.39,29.67 16.35,31.12 L7.14,37.67" stroke-width="3.5"/>
      <path d="M32,32 L32.62,43.29 Q32.76,45.79 34.63,47.45 L43.06,54.97" stroke-width="3.1"/>
      <path d="M32,32 L23.57,39.53 Q21.7,41.19 21.56,43.69 L20.94,54.97" stroke-width="3.1"/>
    </g>
    <g fill="url(#ink)">
      <circle cx="32" cy="6.5" r="6"/>
      <circle cx="51.94" cy="16.1" r="5.6"/>
      <circle cx="12.06" cy="16.1" r="5.6"/>
      <circle cx="56.86" cy="37.67" r="4.8"/>
      <circle cx="7.14" cy="37.67" r="4.8"/>
      <circle cx="43.06" cy="54.97" r="4.2"/>
      <circle cx="20.94" cy="54.97" r="4.2"/>
      <circle cx="32" cy="32" r="6.6"/>
    </g>
    </g>
   </g>
  </g>
</svg>
